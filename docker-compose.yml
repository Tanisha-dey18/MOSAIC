# Local full stack: PostgreSQL + FastAPI backend + nginx-served frontend.
#   cp .env.example .env   (edit POSTGRES_PASSWORD)
#   docker compose up --build
# Frontend: http://localhost:8080   API: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mosaic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mosaic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mosaic} -d ${POSTGRES_DB:-mosaic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MOSAIC_ENV: ${MOSAIC_ENV:-development}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-mosaic}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mosaic}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - storage:/data/storage            # processed features, model artifacts, reports
      - ./datasets:/data/datasets:ro     # raw datasets (read-only)
      - ./reports:/data/reports          # experiment results
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  storage:
